<div class="max-w-6xl mx-auto p-6 space-y-6">
  <header class="flex items-center justify-between">
    <h1 class="text-2xl md:text-3xl font-bold">{{ title }}</h1>
    <span class="text-sm text-slate-400">mockado • Angular + Tailwind</span>
  </header>

  <section class="grid grid-cols-1 md:grid-cols-4 gap-4">
    <div class="card"><div class="text-slate-400">Taxa de Ocupação</div><div class="kpi">{{ taxaOcupacao() }}%</div></div>
    <div class="card"><div class="text-slate-400">Internados</div><div class="kpi">{{ ocupados() }}</div></div>
    <div class="card"><div class="text-slate-400">Livres</div><div class="kpi">{{ livres() }}</div></div>
    <div class="card"><div class="text-slate-400">Manutenção</div><div class="kpi">{{ manutencao() }}</div></div>
  </section>

  <section class="card">
    <h2 class="text-lg font-semibold mb-4">Evolução de Ocupação</h2>
    <canvas id="chart" width="400" height="140"></canvas>
  </section>

  <section class="card">
    <h2 class="text-lg font-semibold mb-4">Leitos</h2>
    <div class="overflow-x-auto">
      <table class="min-w-full text-left">
        <thead class="text-slate-400">
          <tr>
            <th class="py-2">ID</th>
            <th class="py-2">Ala</th>
            <th class="py-2">Status</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let l of leitos()" class="border-t border-slate-800">
            <td class="py-2">{{ l.id }}</td>
            <td class="py-2">{{ l.ala }}</td>
            <td class="py-2">
              <span class="px-3 py-1 rounded-full text-xs"
                [ngClass]="{
                  'bg-green-900/50 text-green-300': l.status==='LIVRE',
                  'bg-yellow-900/50 text-yellow-300': l.status==='MANUTENCAO',
                  'bg-red-900/50 text-red-300': l.status==='OCUPADO'
                }">
                {{ l.status }}
              </span>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </section>
</div>
